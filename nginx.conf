server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml font/ttf application/wasm audio/x-wav;

    # Ojo: un add_header dentro de un location anula los del server. Por eso cada
    # location que agrega Cache-Control repite también los encabezados de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API de precios (Node, mismo contenedor).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 8k;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Archivos de public/ (sin hash): cache corto para que los cambios se vean.
    # (Antes faltaban webp y woff2: se revalidaban en cada visita y, si no existían, devolvían el index.html.)
    location ~* \.(?:mp4|webm|jpg|jpeg|png|webp|avif|gif|svg|ico|ttf|woff2?|wasm|task|wav|mp3)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: así cada deploy se ve al recargar.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
