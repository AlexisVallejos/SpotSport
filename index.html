<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPOT — Todo el deporte en un solo lugar</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080808" />
    <script>
      // Tema antes de dibujar: evita el destello de un tema al otro. Lo mismo hace src/lib/theme.ts al cambiarlo.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('spot:tema') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themePref = pref;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#080808' : '#fbfaf7');
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="/fonts/Inter-Variable.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
