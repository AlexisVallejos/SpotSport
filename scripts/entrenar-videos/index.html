<!doctype html>
<html data-composition-variables='[{"id":"id","type":"string","label":"Ejercicio","default":"squat"}]'>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #070707; }
  #root { position: relative; overflow: hidden;
    background: radial-gradient(70% 60% at 50% 100%, rgba(255,121,0,0.22), transparent 70%), radial-gradient(90% 90% at 50% 30%, #1a1a1a 0%, #070707 100%); }
  #stage { position: absolute; inset: 0; transform: scale(0.86) translateY(-3%); }
  #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 80px), linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
    transform: perspective(600px) rotateX(58deg); transform-origin: 50% 100%; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1280" data-height="720" data-start="0" data-duration="6.8">
  <div id="stage"></div>
  <script src="gsap.min.js"></script>
  <script src="spot-demo.js"></script>
  <script>
    const { id } = window.__hyperframes.getVariables();
    const rule = SpotDemo.RULES[id];
    // Dos ciclos en 6,8 s: el video cierra en loop perfecto (las planchas casi no se mueven; lo que gira es la cámara).
    const period = 3.4;
    const duration = period * 2;
    const scene = SpotDemo.createDemoScene(document.getElementById('stage'));
    scene.fit([0, 0.5, 1].map((p) => SpotDemo.figureAt(id, p)));
    const clock = { t: 0 };
    const draw = () => {
      const t = clock.t;
      scene.show(SpotDemo.figureAt(id, SpotDemo.loop((t / period) % 1)));
      // Una órbita suave que cierra en loop: se ve que es 3D y el corte no se nota.
      scene.setView(0.32 + 0.38 * Math.sin((2 * Math.PI * t) / duration), 0.2);
      scene.render();
    };
    draw();
    requestAnimationFrame(draw);
    // El cuadro se dibuja en cada seek del runtime, también en t = 0 (onUpdate del tween no corre si el tiempo no cambia).
    const tl = gsap.timeline({ paused: true, onUpdate: draw });
    tl.to(clock, { t: duration, duration, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines['root'] = tl;
  </script>
</div>
</body>
</html>
